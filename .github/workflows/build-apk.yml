
name: Build TUCO D Smart Reader V3 APK

on:
  push:
    branches:
      - main
    paths:
      - 'TUCO_D_Smart_Reader_V3_Android_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s TUCO_D_Smart_Reader_V3_Android_Source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -q TUCO_D_Smart_Reader_V3_Android_Source.zip -d extracted
          test -f extracted/TUCO_D_Smart_Reader_Android/settings.gradle
          echo "PROJECT_DIR=extracted/TUCO_D_Smart_Reader_Android" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TUCO-D-Smart-Reader-V3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
