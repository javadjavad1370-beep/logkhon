
name: Deploy TUCO D Smart Reader from ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'TUCO_D_Smart_Reader_GitHub_Source.zip'
      - '.github/workflows/deploy-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract website from source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TUCO_D_Smart_Reader_GitHub_Source.zip"
          EXTRACT_DIR="$RUNNER_TEMP/tuco-extracted"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf "$EXTRACT_DIR" site
          mkdir -p "$EXTRACT_DIR" site

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          APP_DIR="$EXTRACT_DIR/TUCO_D_Smart_Reader_GitHub"

          if [ ! -f "$APP_DIR/index.html" ]; then
            echo "::error::index.html not found inside ZIP"
            find "$EXTRACT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          cp -a "$APP_DIR/." site/

          rm -rf site/.github

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
